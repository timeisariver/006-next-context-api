# PR と main への push で、lint・型チェック・整形・ビルドを確認する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しく push されたら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Netlify（netlify.toml の NODE_VERSION）に合わせる。
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
